[package]
name = "burn-ppocr"
version = "0.1.0"
edition = "2024"

[[example]]
name = "ocr"
required-features = ["pp_ocrv6_medium"]

[[example]]
name = "profile"
required-features = ["pp_ocrv6_medium", "profiling"]

[[bench]]
harness = false
name = "pipeline"

[dependencies]
anyhow = "1"
burn = { version = "0.22.0", features = ["cpu", "cuda", "flex", "vulkan"] }
burn-store = "0.22.0"
clipper2-rust = "1.2.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27.0", default-features = false }
tracing = { version = "0.1", optional = true }

# Match Turso's branches 0.4 dependency and enable std to avoid a removed nightly abort intrinsic.
branches = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
burn-onnx = "0.22.0"

[features]
default = []
embed = []
pp_ocrv6_medium = []
pp_ocrv6_small = []
pp_ocrv6_tiny = []
profiling = ["dep:tracing"]

[profile.bench]
debug = 1

[profile.profiling]
inherits = "release"
debug = 1
